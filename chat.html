<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天界面</title>
    <link rel="stylesheet" href="./css/chat.css">
</head>
<body>
    <div id="main">
        <div id="msg-header" class="msg-box-shadow">我的消息</div>
        <div id="msg-content" class="msg-box-shadow clearfix">
            <div id="sidebar">
                <div id="sidebar-window">最近消息</div>
                <div id="user-sidebar">
                    <div class="chooseUser">
                        <div class="username">姓名
                        </div>
                        <span class="situationDisplay-online"></span>
                    </div>
                </div>
            </div>
            <div id="content">
                <div id="content-window">用户名（之后用变量表示）</div>
                <div id="user-content"></div>
            </div>
        </div>

    </div>
    <script src="./js/chat.js"></script>
</body>
</html>
